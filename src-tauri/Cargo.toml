[package]
name = "sqlighter"
version = "0.1.0"
description = "A modern, minimal and secure SQL client"
authors = ["SQLighter contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
name = "sqlighter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["oracle"]
# Oracle support loads the Oracle Instant Client at runtime (ODPI-C). Without the Instant Client
# installed, Oracle connections fail with a clear message; everything else keeps working.
oracle = ["dep:oracle"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
rand = "0.9"
which = "8"
log = "0.4"

# Databases
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = "0.14"
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "default-rustls"] }
rusqlite = { version = "0.40", features = ["bundled", "backup", "column_decltype"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono", "rust_decimal"] }
oracle = { version = "0.6", optional = true }

# Security
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
x509-parser = "0.17"
russh = "0.63"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# AI / MCP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots", "stream", "json", "http2"] }
axum = "0.8"

# Import / export
csv = "1"
calamine = { version = "0.36", features = ["chrono"] }
rust_xlsxwriter = "0.99"
quick-xml = "0.42"
flate2 = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
